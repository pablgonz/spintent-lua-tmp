name: Automated testing for spintent package (TL2026)

on:
  push:
    branches:
      - "*"
  schedule:
    # at 12:00 UTC (20:00 CST/UTC +8) on Friday
  - cron: "0 12 * * 5"
  workflow_dispatch:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - 2026
        command:
          - doc
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup TeX Live ${{ matrix.version }}
        uses: uses: zauguin/install-texlive@v4
        with:
          package-file: |
            .github/tl_packages

      - name: Install spintent package
        run: l3build install

      - name: Run "l3build ${{ matrix.command }}" (TeX Live ${{ matrix.version }})
        run: l3build ${{ matrix.command }}

      # If fail some test, upload test and log file
      - name: Upload error files
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: github-error-files
          path: |
            ./*.log
            ./*.tex
          retention-days: 2
