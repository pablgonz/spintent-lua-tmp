name: Automated testing for spintent package (TL2026)

on:
  push:
    branches:
      - "*"
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Build (${{ matrix.command }})
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2026
        command:
          - "check -q -H"
          - doc
          - testSE
          - testAF

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup TeX Live ${{ matrix.version }}
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
          texlive_version: ${{ matrix.version }}

      - name: Install show-pdf-tags RNC schemas
        run: tlmgr install --with-doc show-pdf-tags

      - name: Install rnv-wrapp
        run: |
          curl -sSL https://raw.githubusercontent.com/pablgonz/rnv-vera-pdf-cli/main/install-rnv.sh | bash -s -- --unattended
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install veraPDF CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/pablgonz/rnv-vera-pdf-cli/main/install-verapdf.sh | bash -s -- --unattended
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install spintent package
        run: l3build install

      - name: Run "l3build ${{ matrix.command }}"
        run: l3build ${{ matrix.command }}

      - name: Archive failed test output
        if: ${{ failure() }}
        uses: zauguin/l3build-failure-artifacts@v1
        with:
          name: testfiles-spintent
          retention-days: 3
