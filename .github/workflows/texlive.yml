name: Automated testing for spintent package (TL2026)

on:
  push:
    branches:
      - "*"
  schedule:
    # A las 12:00 UTC los viernes
    - cron: "0 12 * * 5"
  workflow_dispatch:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check and Build # Mejor nombre, ya que hace más que solo actualizar caché
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2026 # Cambia esto a la versión real de TeX Live que necesites
        command:
          - doc
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Corregido a v4

      - name: Setup TeX Live ${{ matrix.version }}
        # Aquí se encarga del caché automáticamente
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages
          texlive_version: ${{ matrix.version }} # Conecta la versión de la matriz con la acción

      - name: Install spintent package
        run: l3build install

      - name: Run "l3build ${{ matrix.command }}" (TeX Live ${{ matrix.version }})
        run: l3build ${{ matrix.command }}

      - name: Archive failed test output
        # if: ${{ failure() }} es mejor que always() para capturar solo errores
        if: ${{ failure() }}
        uses: zauguin/l3build-failure-artifacts@v1
        with:
          name: testfiles-fillwith
          retention-days: 3
