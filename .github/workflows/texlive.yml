name: Automated testing for spintent package (TL2026)

on:
  push:
    branches:
      - "*"
  schedule:
    # at 12:00 UTC (20:00 CST/UTC +8) on Friday
  - cron: "0 12 * * 5"
  workflow_dispatch:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Update TeX Live cache
    outputs:
      cache_key: ${{ steps.texlive.outputs.cache_key }}
    strategy:
      matrix:
        version:
          - 2026
        command:
          - doc
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup TeX Live ${{ matrix.version }}
        uses: zauguin/install-texlive@v4
        with:
          # List the required TeX Live packages in a separate file to allow reuse in
          # different workflows.
          package_file: .github/tl_packages

      - name: Install spintent package
        run: l3build install

      - name: Run "l3build ${{ matrix.command }}" (TeX Live ${{ matrix.version }})
        run: l3build ${{ matrix.command }}

      # If fail some test, upload test and log file
      - name: Archive failed test output
        # what does this do exactly? << runs even if build fails
        if: ${{ always() }}
        uses: zauguin/l3build-failure-artifacts@v1
        with:
          name: testfiles-fillwith
          # Decide how long to keep the test output artifact:
          retention-days: 3
